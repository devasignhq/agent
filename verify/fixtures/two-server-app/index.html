<!doctype html>
<html><head><title>Account</title></head>
<body>
  <main>
    <h1>Account</h1>
    <p data-testid="session">Loading…</p>
  </main>
  <script>
    const el = document.querySelector('[data-testid="session"]');
    fetch("http://localhost:4180/api/me", { credentials: "include" })
      .then((r) => (r.ok ? r.json() : null))
      .then((b) => { el.textContent = b && b.user ? "Signed in as " + b.user : "Signed out"; })
      .catch(() => { el.textContent = "Signed out"; });
  </script>
</body></html>
