# .devasign.yml — per-repository review configuration for devasignhq/agent.
# Every key is optional; unset keys fall back to the defaults noted in each comment.
version: 2
review:
  blocking_severities: [blocker, high]   # what makes the verdict FIX_BEFORE_PUSH (high must be verified)
  max_report_findings: 25                # findings shown in the markdown report; everything ships in the JSON
  max_nits: 5
  run_tests: auto                        # auto | always | never — auto runs the suite when a runner is detected
  ignore_paths:                          # excluded from review and from line counts
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/out/**"
    - "**/*.tsbuildinfo"
    - "**/*.generated.*"
    - "**/__snapshots__/**"
    # lockfiles are deliberately NOT ignored — review-dependencies needs them
  agents:
    disable: []                          # e.g. [review-frontend]
    force: []                            # always run, regardless of risk tags — e.g. [review-money]
  language: en                           # language of the written review
commit:                                  # rules for the every-commit flow
  skip_merge_commits: true
  skip_patterns: ["wip", "WIP", "fixup!", "squash!"]   # commit-subject prefixes that skip review
  min_changed_lines: 1                   # skip commits smaller than this (0 reviews even empty commits)
  fast_path_max_lines: 40                # small commits with no money/auth/data/public-api/deps/infra tag
                                         # run intent + correctness + docs only; 0 disables the fast path
  already_reviewed: skip                 # skip | rerun — what to do when .devasign/reviews/<sha>.json exists
family:                                  # explicit sister-repo declaration; wins over heuristics
  name: devasign-escrow                  # this service plus the Soroban contracts it invokes
  role: service                          # this repo is the backend service calling the escrow contract
  sisters:
    # Both Rust contracts expose every entrypoint backend/src/stellar/escrow.ts invokes
    # (create_escrow, get_escrow, release, admin_release, admin_refund, get_usdc_balance),
    # and the deployed one is selected at runtime by STELLAR_ESCROW_CONTRACT_ID — so an
    # escrow-call change should be checked against both.
    - devasignhq/soroban-escrow
    - devasignhq/bounty-escrow
  # contract: omitted — this family shares a Soroban contract ABI, not an OpenAPI/proto/GraphQL file
parity:
  policy: note                           # note (side note only) | warn (medium, non-blocking) | block (medium, blocking)
  ignore_features: []                    # feature ids that legitimately differ across siblings.
                                         # A Rust escrow contract cannot hold most service-side features;
                                         # expect review-cross-repo to mark those `n/a` rather than a gap.
money:
  paths:                                 # files matching these always get the `money` risk tag → review-money runs
    - "backend/src/stellar/**"           # escrow calls, amount/precision, tx build + submit, memo, trustline
    - "backend/src/bounties/**"          # bounty lifecycle: acceptance, release-validation, keeper, webhooks
    - "backend/src/billing/**"           # Stripe, plans, ephemeral plan
    - "backend/src/routes/bounties*"     # bounty + payout HTTP surface
    - "frontend/src/bounty-*"            # funding, invoice PDF, CSV export
    - "frontend/src/screen-fund-bounty.tsx"
    - "contributor/src/wallet.tsx"       # contributor payout wallet
    # read-only today ("NEVER signs or sends") but it builds admin_release/admin_refund
    # invocations with the admin address — that invariant is worth a money review
    - "backend/scripts/diagnose-escrow.ts"
