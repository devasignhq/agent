name: "DevAsign Verify"
description: "Runs DevAsign's generated acceptance tests for this pull request inside your CI and reports per-criterion evidence."
author: "DevAsign"
branding:
  icon: "check-circle"
  color: "green"
inputs:
  api-url:
    description: "DevAsign API origin."
    required: false
    default: "https://devasign-agent.onrender.com"
  fail-on:
    description: "never (default) or verdict — fail this job when a criterion fails verification."
    required: false
    default: "never"
  version:
    description: "@devasign/verify version range to run."
    required: false
    default: "1"
  working-directory:
    description: "Repository checkout to verify (monorepo package or subdirectory)."
    required: false
    default: "."
  resolve-timeout:
    description: "Max seconds to wait for a test plan. DevAsign may shorten this and re-run the workflow once the plan is ready."
    required: false
    default: ""
  cache-browsers:
    description: "Cache the Playwright browser download between runs. Set false to opt out."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    # Keyed on the exact @playwright/test version pinned in verify/package.json: a range
    # would keep hitting this key while serving a stale cache, so Chromium would
    # re-download every run and never re-save. Bump both together.
    # Negated on purpose: if the inputs context is ever unavailable here the
    # expression still enables the cache, rather than silently disabling it.
    - name: Cache Playwright browsers
      if: inputs.cache-browsers != 'false'
      uses: actions/cache@v4
      with:
        # Playwright's own default per OS. Caching a single Linux-style path would
        # save and restore a directory Playwright never reads on macOS or Windows —
        # and relocating it via PLAYWRIGHT_BROWSERS_PATH would hide the browsers of
        # repos that install Playwright themselves.
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: devasign-playwright-1.55.0-${{ runner.os }}-${{ runner.arch }}
    - name: Run DevAsign verification
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEVASIGN_API_URL: ${{ inputs.api-url }}
        # Through env, never interpolated into the run: string — a workflow that
        # wires untrusted data (a PR title, a dispatch payload) into an input
        # would otherwise get shell injection in its own runner.
        DEVASIGN_VERSION: ${{ inputs.version }}
        DEVASIGN_FAIL_ON: ${{ inputs.fail-on }}
        DEVASIGN_RESOLVE_TIMEOUT: ${{ inputs.resolve-timeout }}
      run: |
        args=(run --fail-on "$DEVASIGN_FAIL_ON")
        if [ -n "$DEVASIGN_RESOLVE_TIMEOUT" ]; then
          args+=(--resolve-timeout "$DEVASIGN_RESOLVE_TIMEOUT")
        fi
        npx --yes "@devasign/verify@$DEVASIGN_VERSION" "${args[@]}"
